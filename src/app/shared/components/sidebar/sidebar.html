<aside class="w-56 h-screen fixed left-0 top-0 bg-[#0B0E14] border-r border-white/10 hidden lg:flex flex-col h-full z-50">
  <!-- Brand Header -->
  <div class="h-16 border-b border-white/10 bg-[#0F172A] flex items-center gap-3 px-5 shrink-0">
    <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-bold text-white text-sm shadow-sm">W</div>
    <div>
      <h1 class="text-sm font-semibold tracking-tight text-white leading-tight">WorkforceOS</h1>
      <span class="text-[10px] text-slate-500 font-normal tracking-wide block">v4.2.0-stable</span>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    <a 
      routerLink="/dashboard" 
      routerLinkActive="bg-blue-600/10 text-blue-400 border border-blue-600/20 font-semibold" 
      [routerLinkActiveOptions]="{exact: true}"
      class="flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-colors rounded-md text-sm group">
      <span class="material-symbols-outlined text-lg group-hover:text-blue-400 transition-colors">dashboard</span>
      <span>Panel de Control</span>
    </a>

    <a 
      routerLink="/employees" 
      routerLinkActive="bg-blue-600/10 text-blue-400 border border-blue-600/20 font-semibold"
      class="flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-colors rounded-md text-sm group">
      <span class="material-symbols-outlined text-lg group-hover:text-blue-400 transition-colors">groups</span>
      <span>Empleados</span>
    </a>

    <a 
      routerLink="/payroll" 
      routerLinkActive="bg-blue-600/10 text-blue-400 border border-blue-600/20 font-semibold"
      class="flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-colors rounded-md text-sm group">
      <span class="material-symbols-outlined text-lg group-hover:text-blue-400 transition-colors">payments</span>
      <span>Nómina</span>
    </a>

    <a 
      routerLink="/attendance" 
      routerLinkActive="bg-blue-600/10 text-blue-400 border border-blue-600/20 font-semibold"
      class="flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-colors rounded-md text-sm group">
      <span class="material-symbols-outlined text-lg group-hover:text-blue-400 transition-colors">calendar_today</span>
      <span>Asistencia</span>
    </a>

    <a 
      routerLink="/reports" 
      routerLinkActive="bg-blue-600/10 text-blue-400 border border-blue-600/20 font-semibold"
      class="flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-colors rounded-md text-sm group">
      <span class="material-symbols-outlined text-lg group-hover:text-blue-400 transition-colors">picture_as_pdf</span>
      <span>Reportes PDF</span>
    </a>

    <a 
      routerLink="/settings" 
      routerLinkActive="bg-blue-600/10 text-blue-400 border border-blue-600/20 font-semibold"
      class="flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-colors rounded-md text-sm group">
      <span class="material-symbols-outlined text-lg group-hover:text-blue-400 transition-colors">settings</span>
      <span>Configuración</span>
    </a>

    <!-- BCV Exchange Rate Sidebar Widget -->
    <div class="pt-4 px-1">
      <button 
        (click)="openBcvModal()" 
        type="button" 
        class="w-full bg-[#151921] hover:bg-[#1c222d] border border-amber-500/30 p-3 rounded-xl text-left transition-all group">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[10px] font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1">
            <span>🇻🇪</span> Tasa BCV Oficial
          </span>
          <span class="material-symbols-outlined text-xs text-amber-400 group-hover:scale-110 transition-transform">tune</span>
        </div>
        <p class="text-base font-bold font-mono text-white group-hover:text-amber-300 transition-colors">
          Bs. {{ exchangeService.bcvRate() }}
        </p>
        <p class="text-[9px] text-slate-400 mt-0.5 flex items-center justify-between">
          <span>USD / VES</span>
          <span class="text-amber-400/80 font-mono">1 USD</span>
        </p>
      </button>
    </div>
  </nav>

  <!-- User Profile Info & Logout at Bottom -->
  <div class="p-3 border-t border-white/10 bg-[#0F172A]/50 shrink-0 space-y-2">
    <button 
      (click)="openProfileModal()"
      type="button"
      class="w-full flex items-center gap-2.5 p-2 rounded-md hover:bg-white/10 border border-transparent hover:border-white/10 text-left transition-all group cursor-pointer"
      title="Haz clic para editar tu perfil de usuario">
      @if (auth.currentUser()?.photoURL) {
        <img [src]="auth.currentUser()?.photoURL" alt="User avatar" class="w-8 h-8 rounded-full object-cover border border-blue-500/30 shrink-0">
      } @else {
        <div class="w-8 h-8 rounded-full bg-slate-800 border border-blue-500/40 text-blue-400 font-bold flex items-center justify-center text-xs shrink-0 group-hover:bg-blue-600 group-hover:text-white transition-colors">
          {{ initials }}
        </div>
      }
      <div class="overflow-hidden flex-1 min-w-0">
        <p class="text-xs font-semibold text-white truncate leading-tight group-hover:text-blue-300 transition-colors">
          {{ auth.currentUser()?.displayName || 'John Doe' }}
        </p>
        <div class="flex items-center justify-between">
          <span class="inline-block text-[9px] text-blue-400 font-bold uppercase tracking-wider truncate">
            {{ roleLabel }}
          </span>
          <span class="material-symbols-outlined text-xs text-slate-500 group-hover:text-blue-400 transition-colors">edit_note</span>
        </div>
      </div>
    </button>

    <button 
      (click)="onLogout()"
      type="button"
      class="w-full flex items-center justify-center gap-2 py-1.5 px-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 border border-red-500/20 rounded-md text-xs font-semibold transition-colors group">
      <span class="material-symbols-outlined text-sm group-hover:-translate-x-0.5 transition-transform">logout</span>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>

<app-profile-modal 
  [isOpen]="showProfileModal()" 
  (closeModal)="showProfileModal.set(false)">
</app-profile-modal>

<app-bcv-rate-modal 
  [isOpen]="showBcvModal()" 
  (closeModal)="showBcvModal.set(false)">
</app-bcv-rate-modal>
