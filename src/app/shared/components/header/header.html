<header class="h-16 bg-[#0F172A] border-b border-white/10 sticky top-0 z-40 px-6 flex items-center justify-between gap-4 shrink-0">
  <!-- Left Side: Back button or Search -->
  <div class="flex items-center gap-4 flex-1 max-w-xl">
    @if (backUrl()) {
      <a 
        [routerLink]="backUrl()" 
        class="inline-flex items-center gap-2 text-xs font-semibold text-blue-400 bg-blue-600/10 border border-blue-600/20 px-3 py-1.5 rounded-md hover:bg-blue-600/20 transition-colors">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        <span>{{ backLabel() }}</span>
      </a>
    } @else {
      <div class="relative w-full">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-lg">search</span>
        <input 
          type="text" 
          [placeholder]="searchPlaceholder()"
          (input)="onSearchInput($event)"
          class="w-full pl-9 pr-4 py-1.5 bg-[#0B0E14] border border-white/10 rounded-md text-xs text-slate-200 placeholder-slate-500 form-input-focus transition-all">
      </div>
    }
  </div>

  <!-- Right Side: Actions, Role Selector & Auth -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- BCV Exchange Rate Ticker Badge Button -->
    <button 
      (click)="openBcvModal()"
      type="button"
      class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 rounded-md transition-all group shrink-0"
      title="Ver/Ajustar Tasa de Cambio BCV Oficial">
      <span class="text-xs">🇻🇪</span>
      <span class="font-mono font-bold text-amber-300">Bs. {{ exchangeService.bcvRate() }}</span>
      <span class="text-[10px] text-amber-400/80 font-normal hidden lg:inline">/USD</span>
      <span class="material-symbols-outlined text-sm text-amber-400 group-hover:scale-110 transition-transform ml-0.5">tune</span>
    </button>

    <!-- Quick Role Tester Selector -->
    <div class="hidden sm:flex items-center gap-1.5 bg-white/5 border border-white/10 px-2.5 py-1 rounded-md text-xs text-slate-300">
      <span class="material-symbols-outlined text-sm text-blue-400">badge</span>
      <span class="text-[11px] text-slate-400">Perfil:</span>
      <select 
        [value]="auth.currentRole()"
        (change)="switchRole($event)"
        class="bg-transparent font-semibold text-blue-400 focus:outline-none cursor-pointer text-xs">
        <option value="admin" class="bg-[#0F172A] text-slate-200">Administrador</option>
        <option value="hr" class="bg-[#0F172A] text-slate-200">Gerente de RRHH</option>
        <option value="standard" class="bg-[#0F172A] text-slate-200">Usuario Estándar</option>
      </select>
    </div>

    <!-- Edit Profile Modal Trigger -->
    <button 
      (click)="openProfileModal()"
      class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold text-slate-200 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-blue-500/30 rounded-md transition-all group"
      title="Actualizar datos de mi perfil">
      <span class="material-symbols-outlined text-base text-blue-400 group-hover:scale-110 transition-transform">edit_note</span>
      <span class="hidden md:inline">Editar Perfil</span>
    </button>

    <!-- Notification Button -->
    <button class="relative p-2 text-slate-400 hover:text-white hover:bg-white/5 rounded-md transition-colors" title="Notificaciones">
      <span class="material-symbols-outlined text-xl">notifications</span>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-blue-500 rounded-full"></span>
    </button>

    <!-- Auth Actions / Logout Button -->
    <div class="pl-2 border-l border-white/10 flex items-center gap-2">
      @if (auth.currentUser()) {
        <div class="flex items-center gap-2">
          @if (!auth.currentUser()?.uid?.startsWith('demo-')) {
            <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-green-500/10 border border-green-500/20 rounded-full">
              <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
              <span class="text-[10px] text-green-400 font-bold uppercase tracking-wider">Google Auth</span>
            </div>
          }
          <button 
            (click)="handleLogout()" 
            class="text-xs font-semibold text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 px-2.5 py-1.5 rounded-md transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">logout</span>
            <span class="hidden md:inline">Salir</span>
          </button>
        </div>
      } @else {
        <a 
          routerLink="/login" 
          class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-md text-xs font-semibold shadow-sm transition-colors">
          <span class="material-symbols-outlined text-sm">login</span>
          <span>Iniciar Sesión</span>
        </a>
      }
    </div>
  </div>
</header>

<app-profile-modal 
  [isOpen]="showProfileModal()" 
  (closeModal)="showProfileModal.set(false)">
</app-profile-modal>

<app-bcv-rate-modal 
  [isOpen]="showBcvModal()" 
  (closeModal)="showBcvModal.set(false)">
</app-bcv-rate-modal>
